[package]
name = "qiskit-qasm2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "qiskit_qasm2"
doctest = false

[lints]
workspace = true

[features]
default = ["py"]
# Enables the native circuit builder.  This needs `qiskit-circuit` but not `pyo3`; note that
# `qiskit-circuit` itself depends on `pyo3` unconditionally, so this alone does not give a
# build free of `libpython`.
circuit = ["dep:qiskit-circuit"]
py = ["dep:pyo3", "circuit"]

[dependencies]
num-bigint.workspace = true
hashbrown.workspace = true

[dependencies.pyo3]
workspace = true
optional = true
features = ["py-clone", "num-bigint"]

[dependencies.qiskit-circuit]
workspace = true
optional = true

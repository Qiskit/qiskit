[package]
name = "qiskit-pyext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "qiskit_pyext"
doctest = false
crate-type = ["cdylib"]

[lints]
workspace = true

# If you add features in here, consider whether they should be configurable by users, and whether
# they should be defaults.
#
# Add all new features and controlling environment variables to:
#
# * `build_backend/qiskit_local_build.py` in the `KNOWN_FEATURES` list.
# * `docs/devguide/contributing.md` in the "compile-time options" section.
# * the externally hosted Qiskit/documentation guide on installing from source.
#
# Add defaults to `pyproject.toml` in the `tool.maturin.features` key.
[features]
cache_pygates = ["qiskit-circuit/cache_pygates", "qiskit-accelerate/cache_pygates", "qiskit-transpiler/cache_pygates", "qiskit-cext/cache_pygates", "qiskit-qpy/cache_pygates"]
global_mimalloc = ["qiskit-util/global_mimalloc"]

[build-dependencies]
anyhow.workspace = true
cbindgen.workspace = true
qiskit-bindgen.workspace = true
qiskit-cext-vtable = { workspace = true, features = ["python_binding"] }

[dependencies]
anyhow.workspace = true
pyo3.workspace = true
qiskit-accelerate.workspace = true
qiskit-circuit = { workspace = true, features = ["passmanager"] }
qiskit-circuit-library.workspace = true
qiskit-passmanager.workspace = true
qiskit-qasm2.workspace = true
qiskit-qasm3.workspace = true
qiskit-qpy.workspace = true
qiskit-cext = { workspace = true, features = ["python_binding"] }
qiskit-cext-vtable = { workspace = true, features = ["python_binding", "addr"] }
qiskit-transpiler.workspace = true
qiskit-util.workspace = true
qiskit-quantum-info = { workspace = true, features = ["python"] }
qiskit-synthesis.workspace = true

[package]
name = "qiskit-bindgen-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "qiskit-bindgen-cli"

[dependencies]
qiskit-bindgen.workspace = true
qiskit-cext-vtable  = { workspace = true, features = ["python_binding"] }
anyhow.workspace = true
qiskit-util.workspace = true
itertools.workspace = true
cbindgen.workspace = true

# Transitive dependency `rsgridsynth` pins `clap` version `=4.5.4`. `clap` can
# be updated past `4.5.4` when the next major version of `clap` is released or
# when `rsgridsynth` unpins the exact version. If one these conditions aren't
# met, `cargo` will automatically downgrade `rsgridsynth`, introducing a
# regression that surfaces in fault tolerance compilation.
clap = { version = "4.5.4", features = ["derive"] }

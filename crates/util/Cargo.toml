[package]
name = "qiskit-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "qiskit_util"
doctest = false

[features]
py = ["dep:pyo3"]
# Renamed from the implicit `mimalloc` implied by `dependencies.mimalloc.optional = true` to make it
# clearer that it turns on a _global_ feature.
global_mimalloc = ["dep:mimalloc"]

[lints]
workspace = true

[dependencies]
num-complex.workspace = true
pyo3 = { workspace = true, optional = true }
thiserror.workspace = true
indexmap.workspace = true
foldhash.workspace = true
mimalloc = { workspace = true, optional = true, features = ["local_dynamic_tls"] }

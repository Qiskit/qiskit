[package]
name = "qiskit-mir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "qiskit_mir"
doctest = false

[lints]
workspace = true

[features]
mem_dbg = ["dep:mem_dbg"]

[dependencies]
bytemuck.workspace = true
hashbrown.workspace = true
mem_dbg = { workspace = true, optional = true }
qiskit-util.workspace = true
rustworkx-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
itertools.workspace = true

[[test]]
name = "memory_report"
required-features = ["mem_dbg"]
# Prints a report from `main` rather than running `#[test]` functions.
harness = false

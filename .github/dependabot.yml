version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # When we use crates that depend on PyO3, we all have to agree on the version used, so they
      # need to be bumped as one group.  Typically, minor-version bumps of PyO3 will require manual
      # intervention, but it's still helpful to have Dependabot prod us to do it.
      pyo3:
        patterns:
          - "pyo3"
          - "numpy"
        update-types:
          - "major"
          - "minor"
      cargo:
        patterns: ['*']
    labels:
      - "Rust"
      - "dependencies"
      - "Changelog: None"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      # Catch-all for all other Actions update.  Dependabot guarantees that packages are updated in
      # the first group they match, so previous matches won't get folded into here.
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
    labels:
      - "type: qa"
      - "dependencies"
      - "Changelog: None"

  # Configuration for the wheels-build job.
  #
  # Dependabot doesn't (as of 2026-08-11) have a way to select only one specific dependency-group or
  # manifest file from a directory, so instead we isolate this configuration to a single-file
  # directory.
  - package-ecosystem: "pip"
    directory: "/.github/workflows/wheels"
    groups:
      python-wheels:
        patterns:
          - "*"
    schedule:
      interval: weekly
    labels:
      - "type: qa"
      - "ci: test wheels"
      - "dependencies"
      - "Changelog: None"

name: Documentation
on:
  push:
    branches:
      - main
    tags:
      # Run on all tags.
      - "*"
  workflow_dispatch:

jobs:
  config:
    name: Configure
    uses: $/.github/workflows/config.yml

  resolve:
    if: github.repository_owner == 'Qiskit'
    name: Resolve
    needs: [config]
    runs-on: ${{ needs.config.outputs.runner-linux-x86_64 }}
    steps:
      - id: resolve
        name: Resolve branch name
        run: |
          set -e
          # Tags like 1.0.0 and 1.0.0rc1 should point to their stable branch. We do this
          # to reduce the diff in the qiskit/documentation repository between generating
          # the API docs from a tag release versus a workflow_dispatch.
          if [[ $GITHUB_REF_NAME =~ ^([0-9]+\.[0-9]+) ]]; then
            BRANCH_NAME="stable/${BASH_REMATCH[1]}"
          else
              BRANCH_NAME="$GITHUB_REF_NAME"
          fi
          echo "Using branch '${BRANCH_NAME}' for GitHub source code links"
          echo "base-branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
    outputs:
      base-branch: "${{ steps.resolve.outputs.base-branch }}"

  docs:
    if: github.repository_owner == 'Qiskit'
    needs: [config, resolve]
    name: Build documentation
    uses: $/.github/workflows/docs.yml
    with:
      python-version: ${{ needs.config.outputs.python-new }}
      runner: ${{ needs.config.outputs.runner-linux-x86_64 }}
      base-branch: ${{ needs.resolve.outputs.base-branch }}
    secrets: inherit

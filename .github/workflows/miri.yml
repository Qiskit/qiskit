---
name: Miri
on:
  workflow_call:
    inputs:
      runner:
        description: Runner image to use.
        type: string
        required: true

jobs:
  miri:
    name: Miri
    runs-on: ${{ inputs.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Select Rust version
        run: echo "RUSTUP_TOOLCHAIN=$(tools/miri.bash -t)" >> "$GITHUB_ENV"

      - name: Install Rust
        run:
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }}
            --override
            --profile minimal
            --component miri
            --no-self-update

      - name: Prepare Miri
        run: tools/miri.bash -p

      - name: Run Miri
        run: tools/miri.bash

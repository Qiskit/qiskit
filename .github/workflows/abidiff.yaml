name: Compare C ABI

on:
  pull_request:
    paths:
      - "crates/bindgen/**"
      - "crates/bindgen-cli/**"
      - "crates/cext/**"
      - "crates/cext-vtable/**"

jobs:
  abidiff:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout w/ tags
        uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Checkout baseline
        run: |
          tag=$(git tag -l | tail -1)
          git checkout "${tag}"

      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/
            ~/.rustup/update-hashes/
          key: ${{ runner.os }}-rustup-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build baseline
        run: |
          make cheader clib-dev
          mv dist/c/lib/libqiskit.so dist/c/lib/libqiskit.so.base

      - name: Fetch commit
        run: |
          git checkout -

      - name: Build commit
        run: make cheader clib-dev

      - name: Install ABI tools
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y abigail-tools

      - name: Compare ABI
        continue-on-error: true
        run: |
          cd dist/c/lib
          abidiff libqiskit.so.base libqiskit.so \
            --header-file-1 ../include \
            --drop-private-types \

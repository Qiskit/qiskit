name: Coverage report
on:
  push:
  pull_request:
    branches: ['main']
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}
  # Only cancel in PR mode.  In push mode, don't cancel so we don't see spurious test "failures",
  # and we get coverage reports on Coveralls for every push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The Python and Rust/C suites are measured in separate jobs so they run concurrently. Building
  # is intentionally duplicated to avoid having to transfer large artifacts.
  python:
    if: github.repository_owner == 'Qiskit'
    name: Python coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.13'

      - name: Install Rust
        run:
          rustup toolchain install stable
            --override
            --profile minimal
            --component llvm-tools-preview
            --no-self-update

      - name: Cache stestr
        uses: actions/cache@v6
        with:
          key: 'stestr | "${{ runner.os }}" | "coverage" | "${{ github.run_id }}"'
          restore-keys: 'stestr | "${{ runner.os }}" | "coverage"'
          path: .stestr

      # This is needed to support any requirements, particularly in the `optionals` set,
      # that might not have 'pyproject.toml' files specifying their build requirements.
      # Modern pip (23.1+) can error out if it doesn't have `wheel` and we ask for one
      # of these legacy packages.
      - name: Ensure basic build requirements
        run: python -m pip install -c constraints.txt --upgrade pip setuptools wheel

      - name: Build and install Qiskit and requirements
        run: python -m pip install -c constraints.txt --group test --group optionals-all -e .
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-Cinstrument-coverage"
          LLVM_PROFILE_FILE: "qiskit-%p-%m.profraw"

      - name: Generate unittest coverage report
        run: |
          set -e
          python tools/report_numpy_state.py
          stestr run
        env:
          QISKIT_TEST_CAPTURE_STREAMS: 1
          QISKIT_PARALLEL: FALSE
          QISKIT_IGNORE_USER_SETTINGS: TRUE
          PYTHON: "coverage run --source qiskit --parallel-mode"
          COVERAGE_CORE: sysmon

      - name: Convert to lcov
        run: |
          set -e
          coverage combine
          coverage lcov -o python.info

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: python.info
          if-no-files-found: error

  native:
    if: github.repository_owner == 'Qiskit'
    name: Rust and C coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.13'

      - name: Install Rust
        run:
          rustup toolchain install stable
            --override
            --profile minimal
            --component llvm-tools-preview
            --no-self-update

      # save about a minute of CI time by caching grcov
      - name: Record Rust version for cache key
        id: rust-version
        run: 'echo "version=$(rustc --version | tr -d " ()")" >> $GITHUB_OUTPUT'

      - name: Cache grcov
        uses: actions/cache@v6
        with:
          key: 'grcov | "${{ runner.os }}" | "0.8.20" | "${{ steps.rust-version.outputs.version }}"'
          path: ~/.cargo/bin/grcov

      - name: Install dependencies
        run: command -v grcov || cargo install --locked grcov@0.8.20

      - name: Generate ctest coverage report
        run: make ccoverage
        env:
          LLVM_PROFILE_FILE: "qiskit-%p-%m.profraw"

      - name: Generate rust test coverage report
        run: |
          cargo test
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-Cinstrument-coverage"
          LLVM_PROFILE_FILE: "qiskit-%p-%m.profraw"

      - name: Generate lcov with grcov
        run: |
          # Copy ctest coverage to cwd
          cp test/c/build/*profraw .
          # We set the --source-dir to '.' because we want all paths to appear relative to the repo
          # root (we need to combine them with the Python ones), but we only care about `grcov`
          # keeping the `crates/*` files; we don't care about coverage in dependencies.
          # `--excl-line` takes a Rust regex; lines calling these defensive macros are never
          # expected to execute during testing, so keep them out of the coverage report.
          grcov . --binary-path target/debug/ --source-dir . --output-type lcov --output-path rust.info --llvm --branch --parallel --keep-only 'crates/*' \
            --excl-line '(unreachable!|panic!|todo!|unimplemented!)'

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: rust.info
          if-no-files-found: error

  combine:
    if: github.repository_owner == 'Qiskit'
    name: Combine and upload
    runs-on: ubuntu-latest
    needs: [python, native]

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-python
      - uses: actions/download-artifact@v8
        with:
          name: coverage-rust

      - name: Install lcov
        run: sudo apt-get install lcov

      - name: Combine data
        run: |
          set -e
          lcov --ignore-errors inconsistent,corrupt \
            --add-tracefile python.info --add-tracefile rust.info --output-file coveralls.info

      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coveralls.info

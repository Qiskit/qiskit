---
features_c:
  - |
    Added :c:func:`qk_circuit_from_openqasm2`, which loads a :c:type:`QkCircuit` from a string
    containing an OpenQASM 2 program.  The importer is written natively in Rust and does not call
    into Python.  Parsing is configured with a :c:type:`QkOpenQasm2Options`, whose defaults are
    given by :c:func:`qk_openqasm2_default_options`.  A failure returns a null pointer and writes a
    human-readable description to the ``error`` out-parameter, which the caller releases with
    :c:func:`qk_str_free`.  The custom classical functions and custom instructions accepted by
    ``qiskit.qasm2.loads`` are not yet supported through C; a program relying on those extensions
    will fail to parse.

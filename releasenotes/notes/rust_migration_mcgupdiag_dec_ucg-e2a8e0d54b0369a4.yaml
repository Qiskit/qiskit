---
performance:
  - |
    Building the definition of :class:`.MCGupDiag` is now faster, because its decomposition is
    implemented in Rust and calls the :class:`.UCGate` decomposition directly, instead of creating an
    intermediate Python :class:`.UCGate` object. Benchmarks show speedups from about 2x with one
    control qubit to about 12x with eight control qubits.
    See `#17086 <https://github.com/Qiskit/qiskit/pull/17086>`__ for more details.
upgrade:
  - |
    The ``definition`` of :class:`.MCGupDiag` now contains the synthesized single-qubit and ``cx``
    gates directly, instead of a nested :class:`.UCGate`, so :meth:`~.QuantumCircuit.decompose`
    shows a different circuit. When ancilla qubits are present, the synthesized instruction acts only
    on the target and control qubits. The implemented unitary and the number of ``cx`` gates are
    unchanged.

---
features:
  - |
    The :func:`.state_to_latex` function now supports visualizing quantum states
    in different bases. Use the new ``ket_basis`` parameter to see your states
    in the computational, Hadamard, or Y basis instead of always defaulting to
    the computational basis.

    Supported bases are:

    * ``'z'`` (default): Computational basis with :math:`|0\rangle` and :math:`|1\rangle`
    * ``'x'`` or ``'h'``: Hadamard basis with :math:`|+\rangle` and :math:`|-\rangle`
    * ``'y'``: Y basis with :math:`|+i\rangle` and :math:`|-i\rangle`

    For example, to see a quantum state in the Hadamard basis::

        from qiskit.quantum_info import Statevector
        from qiskit.visualization.state_visualization import state_to_latex

        sv = Statevector.from_label("0")
        print(state_to_latex(sv, ket_basis="x"))

---
fixes:
  - |
    Fixed a bug in :class:`.OptimizeSwapBeforeMeasure` where, after removing a
    swap, measurements writing to the same classical bit could be re-created in
    a different order, changing the final value of that bit. The original
    order of the measurements is now preserved.
  - |
    Fixed a bug in :class:`.OptimizeSwapBeforeMeasure` that could raise a
    ``ValueError`` when a measurement following a swap was on a different
    qubit than the swap's qubits but shared a classical bit with one of them.

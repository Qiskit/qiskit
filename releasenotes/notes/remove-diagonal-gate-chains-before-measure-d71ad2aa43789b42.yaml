---
features_transpiler:
  - |
    The :class:`.RemoveDiagonalGatesBeforeMeasure` transpiler pass now removes all
    consecutive diagonal gates before a measurement in one run, and the chain can mix
    single- and multi-qubit diagonal gates. Before, the pass removed only the diagonal
    gate directly in front of each measurement. The preset pass managers run this pass
    once, in the ``init`` stage at optimization levels 2 and 3, so transpiling such a
    circuit could leave the rest of the chain in place.

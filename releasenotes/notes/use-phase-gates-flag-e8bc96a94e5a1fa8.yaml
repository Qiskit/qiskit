features_circuits:
  - |
    New boolean ``use_phase_gates`` parameter to :func:`.pauli_feature_map`, :func:`.z_feature_map` and :func:`.zz_feature_map`.
    
    The default value is True and that generates the circuits using phase gates as before the change
    
    When this parameter is set to False, the circuit is generated using ``RZ`` rotations and ``RZZ`` gates.
    
    The new circuits are logically equivalent to the original circuits up to a global phase.

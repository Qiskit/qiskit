---
fixes:
  - |
    :c:func:`qk_control_flow_instruction_free` now accepts a null pointer and does nothing,
    matching every other ``qk_*_free`` function in the C API.  Previously, passing a null
    pointer was undefined behavior.  The generated documentation now states this null-safety
    guarantee consistently for all of the ``qk_*_free`` functions.

    Fixed `#17049 <https://github.com/Qiskit/qiskit/issues/17049>`__.

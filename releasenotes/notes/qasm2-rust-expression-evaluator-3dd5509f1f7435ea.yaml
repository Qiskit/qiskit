---
upgrade_qasm:
  - |
    OpenQASM 2 ``gate``-body expressions are now evaluated in Rust.  Real-valued
    expressions give the same results as before, but ``sqrt``/``ln`` of a non-positive
    argument and ``^`` with a negative base and non-integer exponent now raise
    :class:`~qiskit.qasm2.QASM2ParseError`, where they previously raised
    :exc:`ValueError` and ``CircuitError`` respectively.  Both are still raised lazily,
    when the gate's ``definition`` is first built.

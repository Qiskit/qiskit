---
prelude: |
  Qiskit v2.6.0 is a new feature release of the Qiskit SDK.

  This release introduces important new functionality into the Qiskit SDK,
  including the following:

  * **A Multi-IR Pass Manager in C and Python:** Users are now able to
    create a :class:`.PassManager` from the C API which can use different
    Intermediate Representations (IRs) as input and output. Refer to 
    :ref:`capi-pass-manager` for more details.

  * **Custom Operations in C:** Users are now able to create custom
    :class:`.Operation` types using the C API. Please refer to 
    :ref:`capi-operations` for more details.

  * **QPY 18 and C API:**
  
    * QPY serialization and de-serialization is now available via the C API.
      Users are now able to use QPY for roundtrip serialization from C as well
      as inter-operate with Python workflows. Please note that loading QPY from
      C is only supported for payloads using QPY v13 and onwards. Refer to
      :ref:`capi-qpy`.
    * QPY v18 which introduces a new format version and produces payloads with
      smaller footprints. Please refer to :ref:`qpy_version_18`.

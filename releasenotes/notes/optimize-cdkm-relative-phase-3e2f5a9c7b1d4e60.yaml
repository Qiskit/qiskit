---
features_synthesis:
  - |
    Updated :func:`.adder_ripple_c04` to use relative-phase Toffoli gates in
    its compute-uncompute pairs. For an :math:`n`-bit fixed adder, this reduces
    the CX count from :math:`16n` to :math:`10n - 8` and the T-count from
    :math:`14n` to :math:`8n`, without changing the implemented unitary.
features_transpiler:
  - |
    Updated the default high-level synthesis methods for
    :class:`.ModularAdderGate`, :class:`.HalfAdderGate`, and
    :class:`.FullAdderGate` to account for the lower CX and T counts of
    :func:`.adder_ripple_c04`. The selected method depends on the optimization
    metric, the number of state qubits, and whether a clean auxiliary qubit is
    available.

---
fixes:
  - |
    Fixed a bug where a ``ctrl_state`` bitstring whose length differed from the number of control
    qubits was not rejected. For example, ``HGate().control(2, ctrl_state="1")`` was silently
    interpreted as ``"01"``. A :exc:`.CircuitError` is now raised whenever the length of a
    ``ctrl_state`` string is not equal to ``num_ctrl_qubits``, as documented. If your code relied
    on the old behavior, pass a bitstring of the full length (for example ``"01"``) or an integer.
    Fixed `#17228 <https://github.com/Qiskit/qiskit/issues/17228>`__.

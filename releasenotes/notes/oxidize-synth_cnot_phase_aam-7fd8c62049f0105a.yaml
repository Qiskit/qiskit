---
performance:
  - Ported :func:`~.synth_cnot_phase_aam` to Rust.  The new implementation is about x853
    faster than the previous Python implementation when synthesizing a parity network with 120
    terms on 150 qubits. 
    See `#12937 <https://github.com/Qiskit/qiskit/pull/12937>`__ for more details.

fixes:
  - :class:`PhaseGate` are 2pi periodic, that means any angle modulo 2pi will yeild the same PhaseGate.
    A bug where angle modulo pi was applied, was fixed by changing it to angle modulo 2pi.
    See `#12937 <https://github.com/Qiskit/qiskit/pull/12937>`__ for more details.


---
fixes:
  - |
    Fixed :meth:`.QuantumCircuit.remove_final_measurements` and the
    :class:`.RemoveFinalMeasurements` transpiler pass removing a measurement whose
    result is read by a later instruction, such as the condition of an
    :meth:`~.QuantumCircuit.if_test` block.  A measurement is now only treated as
    final if nothing else uses the clbit it wrote to, so feed-forward circuits keep
    their meaning.
    Fixed `#16998 <https://github.com/Qiskit/qiskit/issues/16998>`__.

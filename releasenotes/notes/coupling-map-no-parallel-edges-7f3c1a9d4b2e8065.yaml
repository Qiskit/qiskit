---
fixes:
  - |
    :class:`.CouplingMap` no longer stores parallel edges. The backing
    :class:`~rustworkx.PyDiGraph` was a multigraph, so a coupling that was given more than
    once was stored more than once::

        from qiskit.transpiler import CouplingMap

        # Previously: EdgeList[(0, 1), (0, 1)].  Now: EdgeList[(0, 1)].
        CouplingMap([[0, 1], [0, 1]]).get_edges()

    Duplicate couplings now collapse onto the existing edge, both in the constructor and in
    :meth:`.CouplingMap.add_edge`. As a knock-on effect,
    :attr:`.CouplingMap.is_symmetric` no longer reports a symmetric coupling map as
    asymmetric when one of its couplings is duplicated, and
    :meth:`.CouplingMap.make_symmetric` on such a map now produces a symmetric map.

---
features_c:
  - |
    The type that backs :attr:`.QuantumCircuit._data` is now nameable as
    :class:`qiskit.circuit.CircuitData`.  All methods and attributes on the object are still
    private, regardless of their naming convention.
  - |
    A new public constructor, :meth:`.QuantumCircuit.from_circuit_data`, allows reconstruction
    of a full circuit from the :attr:`~.QuantumCircuit._data` attribute.

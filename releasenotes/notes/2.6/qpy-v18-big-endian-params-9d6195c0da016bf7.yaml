---
upgrade_qpy:
  - |
    QPY format version 18 corrects the encoding of integer and float
    ``INSTRUCTION_PARAM`` values to use big-endian byte order, consistent with
    the rest of the QPY specification.  In QPY format versions 1–17 these values
    were mistakenly written in little-endian.  Files produced by older Qiskit
    releases (format version ≤ 17) are still read correctly; this change only
    affects files written with ``version=18`` or higher.

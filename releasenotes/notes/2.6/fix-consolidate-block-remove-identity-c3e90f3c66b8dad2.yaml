---
fixes:
  - |
    Fixed an inconsistency in :class:`.ConsolidateBlocks`, which removed identity-equivalent
    sequences differently from how :class:`.RemoveIdentityEquivalent` and Qiskit's other transpiler passes do.
    This has been fixed and :class:`.ConsolidateBlocks` now behaves consistently by using the average gate
    fidelity to check whether a sequence is close to the identity. This implies that
    sequences that are equivalent to the identity up to global phase are now also being removed.
